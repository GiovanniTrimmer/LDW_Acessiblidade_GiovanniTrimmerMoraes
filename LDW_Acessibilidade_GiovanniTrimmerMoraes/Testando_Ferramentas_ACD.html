 <!DOCTYPE html>
<html lang="pt-br">
    <head> 
        <style>
            body {
                font-family: Arial, sans-serif;
                text-align: center;
                padding: 20px;
            }
            .icone{
                height: 20px;
                width: 20px;
            }
            .preto-e-branco{
                filter: grayscale(100%);
            }
            .alto-contraste{
                background-color: red;
                color: blue;
            }
            .alto-contraste a{
                color: yellow;
            }
        </style>
        <title>Testando Ferramentas ACD</title> 
    </head>
    <body>
      <h1> Testando Ferramentas ACD</h1> 
      <a href="https://www.exemplo.com">Testando Link</a>
      <button id="preto-e-branco"><img src="ico_preto_e_branco.png" class=icone></button>
      <button id="a-mais"><img src="ico_a_mais.png" class=icone></button>
      <button id="a-menos"><img src="ico_a_menos.png" class=icone></button>
      <button id="alto-contraste"><img src="ico_alto_contraste.png" class=icone></button>
      <button id="libras"><img src="ico_libras.png" class=icone></button>
      <button id="voz"><img src="ico_voz.png" class=icone></button>
      <img src="deficiencias.png">
      </body>
    
      <!--Preto e Branco-->
    <script>
        document.getElementById('preto-e-branco').addEventListener('click',function()
    {
        document.body.classList.toggle('preto-e-branco')
    });
    </script>

     <!--A+ e A--->
     <script type="text/javascript">
        window.onload = function()
        {
            //Seleciona o elemento <body> para que possamos alterar seu estilo.
                var corpoDaPagina = document.querySelector('body');
                var aumentarTexto = document.getElementById('a-mais');
                var diminuirTexto = document.getElementById('a-menos');

            //O padrão de tamanho equivale a 100% do valor definido no style.
            var fontSize = 100;
 
            //Valor percentual de 10% que irá aumentar ou diminuir do padrão da fonte.
            var qntAumentarDiminuir = 10;

            //Evento de Click para aumentar a fonte
            aumentarTexto.addEventListener
            ('click', function(event)
        {
            fontSize = fontSize + qntAumentarDiminuir;
            corpoDaPagina.style.fontSize = fontSize + '%';
        }
        );

        //Evento de Click para diminuir o tamnaho da fonte
        diminuirTexto.addEventListener
            ('click', function(event)
           {
            fontSize = fontSize - qntAumentarDiminuir;
            corpoDaPagina.style.fontSize = fontSize + '%';
        }
    );
    }
     </script>

<!--Alto Contraste-->
<script>
    document.getElementById('alto-contraste').addEventListener
    ('click', function()
{
    document.body.classList.toggle('alto-contraste');
}
);
</script>

<!--Libras-->
<div vw class="enabled">
    <div vw-access-button class="active"></div>

    </div>
  </div>

  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>
    </body>

</html>
